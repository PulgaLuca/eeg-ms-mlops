[project]
name = "eeg-ms-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",

enabled: true
scale_features: false

estimator:
  objective: "binary:logistic"
  eval_metric: logloss
  tree_method: hist
  n_jobs: 1

parameter_grid:
  selector__k: [10, 20, all]
  model__n_estimators: [100, 300]
  model__max_depth: [1, 2]
  model__learning_rate: [0.03, 0.1]
  model__min_child_weight: [1, 3]

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Run Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">EEG</span>
        <span><strong>Run Dashboard</strong><small>MS classification lab</small></span>
      </a>
      <span class="scope">Read-only experiment monitor</span>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
